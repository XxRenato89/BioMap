# Integración continua: lint, formato y todos los tests.
# Los tests de integración corren contra un PostGIS real levantado como servicio.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: biomap
          POSTGRES_PASSWORD: biomap
          POSTGRES_DB: biomap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biomap -d biomap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://biomap:biomap@localhost:5432/biomap_test
      TEST_DATABASE_URL: postgres://biomap:biomap@localhost:5432/biomap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test

  # Flujos completos del kiosco en un navegador real (sin base de datos: API en modo de prueba).
  e2e:
    runs-on: ubuntu-24.04 # Playwright 1.55 has no Chromium build for ubuntu 26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
