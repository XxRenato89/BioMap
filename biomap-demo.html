<!doctype html>
<html lang="es" data-contrast="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BioMap · Demo de mascota y Bio-Book</title>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --c-forest:#1d4a37; --c-forest-2:#2f6b4f; --c-accent:#d9631a; --c-accent-ink:#fff;
  --c-cream:#f7f2e7; --c-cream-2:#ece4d2; --c-ink:#14261d; --c-ink-2:#455a4e;
  --c-hist:#8a5a2b; --c-eco:#2a8a55; --c-tur:#2a74ad; --c-ok:#2a8a55;
  --panel-bg:rgba(247,242,231,.96); --panel-border:rgba(20,38,29,.14);
  --r-md:14px; --r-lg:22px;
  --shadow-1:0 2px 8px rgba(10,30,20,.20); --shadow-2:0 12px 34px rgba(10,30,20,.30);
  --t-fast:160ms; --t-med:320ms; --ease:cubic-bezier(.2,.8,.2,1);
  --fs:16px;
}
html[data-contrast="high"]{
  --panel-bg:#fff; --panel-border:#000; --c-ink:#000; --c-ink-2:#111;
  --c-accent:#a83200; --c-forest:#0a2a1c; --c-cream:#fff; --c-cream-2:#e4e4e4;
  --c-hist:#6b3f12; --c-eco:#0d6b3a; --c-tur:#0b4f85;
}
html{font-size:var(--fs)}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--c-ink);background:#cfe0d0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ ESCENA 3D ============ */
.stage{position:fixed;inset:0;perspective:1100px;overflow:hidden;background:linear-gradient(#a9cde4 0,#d3e6ea 30%,#dfe9d3 100%)}
.shift{position:absolute;inset:0;transform-style:preserve-3d;transform:translate(var(--sx,0px),var(--sy,0px));transition:transform .7s var(--ease)}
.world{position:absolute;left:50%;top:60%;width:1600px;height:1100px;transform-origin:0 0;transform-style:preserve-3d;--tilt:58;--bz:1}
.world>svg.land{position:absolute;left:-500px;top:-350px;width:2600px;height:1800px}
.fog{position:absolute;inset:0;pointer-events:none;
  background:
   linear-gradient(to bottom,rgba(176,208,228,1) 0,rgba(184,214,228,.92) 9%,rgba(190,218,224,.55) 20%,rgba(200,222,210,0) 38%),
   radial-gradient(ellipse at 50% 62%,transparent 52%,rgba(8,28,18,.30) 100%)}

/* billboards (se mantienen de pie sobre el plano inclinado) */
.bb{position:absolute;left:0;top:0;transform-origin:50% 100%;
  transform:translate(-50%,-100%) rotateX(calc(var(--tilt) * -1deg)) scale(var(--bz))}
.node,.actor,#layer-nodes,#layer-labels{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.ground{position:absolute;left:-6200px;top:-5200px;width:13000px;height:11400px;transform:translateZ(-2px);
  background:radial-gradient(ellipse at 50% 50%,#3a5d33 0,#2e5030 22%,#2a4a3c 52%,#4f726c 100%)}

/* pines */
.pin{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;
  filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));transition:opacity .3s,filter .3s}
.pin .lbl{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:999px;padding:4px 12px;
  font-size:.875rem;font-weight:700;white-space:nowrap;color:var(--c-ink);letter-spacing:.01em}
.pin .badge{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
  background:var(--cat);border:4px solid #fff;color:#fff;transition:transform var(--t-med) var(--ease)}
.pin .badge svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pin .stem{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid #fff;margin-top:-8px}
.pin:hover .badge{transform:scale(1.1)}
.pin.avail .badge::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--cat);animation:pulse 2s ease-out infinite}
.pin.current .badge{box-shadow:0 0 0 5px rgba(255,255,255,.55)}
.pin .ok{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--c-ok);border:3px solid #fff;display:none;place-items:center}
.pin.visited .ok{display:grid}
.pin .ok svg{width:12px;height:12px;stroke-width:3.4}
.pin.current .badge,.pin.current .stem{visibility:hidden}
.pin.current .lbl{transform:translateY(-34px)}
.pin.off{opacity:.22;pointer-events:none;filter:grayscale(1)}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}

/* etiquetas del mapa con halo */
.maplbl{font-style:italic;font-weight:700;font-size:1.05rem;color:#eaf6fb;white-space:nowrap;letter-spacing:.04em;
  text-shadow:-1px -1px 0 #1c5470,1px -1px 0 #1c5470,-1px 1px 0 #1c5470,1px 1px 0 #1c5470,0 2px 6px rgba(0,0,0,.4);pointer-events:none;transition:opacity .3s}
body.lvl0 .minor{opacity:0}

/* ============ MASCOTA ============ */
.actor{transition:none}
.actor .shadow{position:absolute;left:-46px;top:-17px;width:92px;height:34px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.5),rgba(0,0,0,0));transform:scale(var(--bz))}
.stand{width:132px;height:106px;pointer-events:none}
.flip{width:100%;height:100%;transition:transform .12s}
.hop{width:100%;height:100%}
.fox{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.fox .bob{animation:breathe 2.6s ease-in-out infinite;transform-origin:64px 98px}
.fox .tail{transform-box:fill-box;transform-origin:100% 80%;animation:wag 1.6s ease-in-out infinite}
.fox .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.fox .leg{transform-box:fill-box;transform-origin:50% 6%}
.fox.run .bob{animation:gallop .22s ease-in-out infinite alternate}
.fox.run .tail{animation:wagfast .22s ease-in-out infinite alternate}
.fox.run .leg{animation:swing .44s linear infinite}
.fox.run .l2,.fox.run .l3{animation-delay:-.22s}
.fox.run .l1{animation-delay:-.11s}.fox.run .l4{animation-delay:-.33s}
.fox.run .head{animation:headbob .22s ease-in-out infinite alternate}
.fox .head{transform-box:fill-box;transform-origin:30% 90%}
.hop.skid{animation:skid .42s var(--ease)}
.hop.cheer{animation:cheer .9s ease-in-out}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes gallop{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-9px) rotate(1.5deg)}}
@keyframes swing{0%{transform:rotate(-38deg)}50%{transform:rotate(38deg)}100%{transform:rotate(-38deg)}}
@keyframes wag{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes wagfast{from{transform:rotate(-14deg)}to{transform:rotate(10deg)}}
@keyframes headbob{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes skid{0%{transform:translateX(0) scale(1,1)}30%{transform:translateX(16px) scale(1.12,.86)}65%{transform:translateX(4px) scale(.96,1.05)}100%{transform:translateX(0) scale(1,1)}}
@keyframes cheer{0%{transform:translateY(0) scale(1,1)}18%{transform:translateY(0) scale(1.1,.88)}40%{transform:translateY(-34px) scale(.94,1.08)}60%{transform:translateY(0) scale(1.08,.9)}78%{transform:translateY(-18px) scale(.98,1.03)}100%{transform:translateY(0) scale(1,1)}}

/* ============ UI (un solo sistema) ============ */
.panel{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);backdrop-filter:blur(8px)}
html[data-contrast="high"] .panel{border-width:2px}
.btn{min-height:48px;min-width:48px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--panel-border);background:var(--panel-bg);
  box-shadow:var(--shadow-1);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.9375rem;transition:transform var(--t-fast),background var(--t-fast)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--c-forest);color:#fff;border-color:transparent}
.btn.accent{background:var(--c-accent);color:var(--c-accent-ink);border-color:transparent}
.btn[aria-pressed="true"]{background:var(--c-forest);color:#fff}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.hud-tl{position:fixed;left:24px;top:24px;width:330px;display:flex;flex-direction:column;gap:12px;z-index:10;touch-action:auto}
.brand{padding:16px 18px}
.brand .row{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:14px;background:var(--c-forest);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand h1{margin:0;font-size:1.5rem;line-height:1.1;letter-spacing:-.01em}
.brand .sub{margin:2px 0 0;font-size:.875rem;color:var(--c-ink-2)}
.progress{margin-top:14px}
.progress .top{display:flex;justify-content:space-between;font-size:.875rem;font-weight:700;margin-bottom:8px}
.bar{height:10px;border-radius:99px;background:var(--c-cream-2);overflow:hidden}
.bar i{display:block;height:100%;width:25%;background:linear-gradient(90deg,var(--c-eco),#6cc58a);border-radius:99px;transition:width .8s var(--ease)}
.dots{display:flex;justify-content:space-between;margin-top:10px}
.dots span{width:14px;height:14px;border-radius:50%;background:var(--c-cream-2);border:2px solid var(--panel-border);transition:all .4s}
.dots span.on{background:var(--c-eco);border-color:var(--c-eco);transform:scale(1.15)}

details.layers{padding:0}
details.layers summary{min-height:52px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:800;font-size:.9375rem;list-style:none;letter-spacing:.02em}
details.layers summary::-webkit-details-marker{display:none}
details.layers summary .cnt{font-weight:700;font-size:.875rem;color:var(--c-ink-2);display:flex;gap:10px;align-items:center}
details.layers summary .chev{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform var(--t-med)}
details.layers[open] summary .chev{transform:rotate(180deg)}
.layerlist{padding:0 12px 12px;display:grid;gap:6px}
.layer{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 8px;border-radius:12px;font-weight:600;font-size:.9375rem;cursor:pointer}
.layer:hover{background:var(--c-cream-2)}
.layer input{position:absolute;opacity:0}
.layer .sw{width:48px;height:28px;border-radius:99px;background:#b7b9ae;position:relative;flex:none;transition:background var(--t-med)}
.layer .sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform var(--t-med) var(--ease)}
.layer input:checked+.sw{background:var(--cat)}
.layer input:checked+.sw::after{transform:translateX(20px)}
.layer input:focus-visible+.sw{outline:3px solid #ffbf47;outline-offset:2px}
.layer .dotc{width:12px;height:12px;border-radius:50%;background:var(--cat);flex:none}

.status{position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:10;display:flex;gap:8px;align-items:center;
  padding:8px 16px;border-radius:99px;font-size:.875rem;font-weight:700}
.status i{width:10px;height:10px;border-radius:50%;background:var(--c-ok);box-shadow:0 0 0 4px rgba(42,138,85,.25)}

.hud-tr{position:fixed;right:24px;top:24px;display:flex;gap:10px;z-index:10;touch-action:auto}
.controls{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:10;align-items:stretch;transition:right .5s var(--ease);touch-action:auto}
.zoomgrp{display:flex;flex-direction:column;border-radius:var(--r-md);overflow:hidden}
.zoomgrp .btn{border-radius:0;box-shadow:none;border-width:0 0 1px 0;min-height:52px}
.zoomgrp .btn:last-child{border-bottom:0}
body.info-open .controls{right:calc(24px + 392px + 16px)}

.seg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;display:flex;padding:6px;gap:4px;border-radius:20px;touch-action:auto}
.seg .opt{position:relative;border:0;background:none;border-radius:15px;min-height:60px;min-width:116px;padding:6px 16px;text-align:center;z-index:1;transition:color var(--t-med)}
.seg .opt b{display:block;font-size:1rem}
.seg .opt small{display:block;font-size:.875rem;color:var(--c-ink-2);margin-top:1px}
.seg .opt[aria-checked="true"]{color:#fff}
.seg .opt[aria-checked="true"] small{color:rgba(255,255,255,.85)}
.seg .pill{position:absolute;top:6px;bottom:6px;left:6px;width:116px;border-radius:15px;background:var(--c-forest);transition:transform var(--t-med) var(--ease),width var(--t-med) var(--ease)}

.tip{position:fixed;left:50%;bottom:104px;transform:translate(-50%,10px);z-index:9;padding:10px 18px;border-radius:99px;font-size:.9375rem;font-weight:600;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;white-space:nowrap}
.tip.show{opacity:1;transform:translate(-50%,0)}
.skip{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:12;display:none}
body.running .skip{display:inline-flex}

/* ============ FICHA ============ */
.info{position:fixed;right:24px;top:84px;width:392px;max-height:calc(100vh - 108px);overflow:auto;z-index:11;padding:0;
  transform:translateX(30px) scale(.97);opacity:0;pointer-events:none;transition:transform .5s var(--ease),opacity .3s;touch-action:auto}
body.info-open .info{transform:none;opacity:1;pointer-events:auto}
.info .photo{height:176px;border-radius:var(--r-lg) var(--r-lg) 0 0;overflow:hidden;position:relative}
.info .photo svg{width:100%;height:100%;display:block}
.info .close{position:absolute;right:10px;top:10px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.info .close svg{width:22px;height:22px;stroke:var(--c-ink);stroke-width:2.6;fill:none;stroke-linecap:round}
.info .body{padding:16px 20px 20px}
.rise{opacity:0;transform:translateY(14px)}
.info.go .rise{animation:rise .55s var(--ease) forwards;animation-delay:calc(var(--i) * 90ms + 120ms)}
@keyframes rise{to{opacity:1;transform:none}}
.chipcat{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:99px;background:var(--cat);color:#fff;font-weight:800;font-size:.875rem}
.info h2{margin:10px 0 6px;font-size:1.5rem;line-height:1.15}
.info .meta{font-size:.875rem;color:var(--c-ink-2);font-weight:600}
.info .lead{margin:10px 0 14px;font-size:1rem;line-height:1.5}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.facts div{background:var(--c-cream-2);border-radius:12px;padding:10px 12px}
.facts dt{font-size:.875rem;color:var(--c-ink-2);font-weight:600}
.facts dd{margin:2px 0 0;font-weight:800;font-size:1rem}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.demo-note{margin:12px 0 0;font-size:.875rem;color:var(--c-ink-2)}

/* ============ BIO-BOOK ============ */
.biobook{position:fixed;left:24px;bottom:24px;width:440px;height:380px;z-index:12;transform:scale(.9);transform-origin:0 100%;pointer-events:none;touch-action:auto}
.biobook>*{pointer-events:auto}
.bb-bust{position:absolute;left:50%;top:0;width:220px;margin-left:-110px;z-index:1;pointer-events:none;animation:bust 3s ease-in-out infinite;transform-origin:50% 100%}
.bb-bust svg{width:100%;display:block;overflow:visible;filter:drop-shadow(0 4px 4px rgba(0,0,0,.28))}
.bb-bust .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.bb-bust .earL{transform-box:fill-box;transform-origin:70% 100%;animation:ear 5s ease-in-out infinite}
@keyframes bust{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ear{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-9deg)}97%{transform:rotate(3deg)}}
.biobook.open .bb-bust{animation:bustjoy .9s ease-in-out}
@keyframes bustjoy{0%{transform:translateY(0)}30%{transform:translateY(-20px) scale(1.04)}60%{transform:translateY(0)}80%{transform:translateY(-8px)}100%{transform:none}}

.bb-stage{position:absolute;left:0;top:112px;width:440px;height:260px;perspective:1300px;z-index:2;pointer-events:none}
.book-shift{position:absolute;left:0;top:0;width:400px;height:260px;transform:translateX(-80px);transition:transform 1s var(--ease);transform-style:preserve-3d;pointer-events:none}
.biobook.open .book-shift{transform:translateX(20px)}
.book-hit{position:absolute;inset:0;pointer-events:auto}
.page-r{position:absolute;left:200px;top:0;width:200px;height:260px;background:linear-gradient(90deg,#efe8d6 0,#fffef9 9%,#fffef9 100%);border-radius:2px 12px 12px 2px;
  box-shadow:0 14px 28px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 10px 8px;gap:2px;border:1px solid #e4dcc6}
.page-r .qr{width:168px;height:168px;display:block}
.page-r .qr svg{width:100%;height:100%;display:block}
.page-r .url{font-size:.875rem;font-weight:700;color:#14261d;text-align:center;line-height:1.2;margin-top:8px;white-space:nowrap}
.page-r .pn{position:absolute;right:14px;bottom:8px;font-size:.75rem;color:#8a8570}
.cover{position:absolute;left:200px;top:0;width:200px;height:260px;transform-origin:0 50%;transform-style:preserve-3d;transition:transform 1s var(--ease)}
.biobook.open .cover{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{border-radius:3px 14px 14px 3px;background:linear-gradient(135deg,#2c6b4d,#173d2d);box-shadow:inset 0 0 0 6px rgba(255,255,255,.07),0 14px 28px rgba(0,0,0,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;border-left:7px solid #10301f}
.face.front .emb{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.55);display:grid;place-items:center}
.face.front .emb svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.face.front h3{margin:0;font-size:1.5rem;letter-spacing:.02em}
.face.front .cta{margin-top:6px;padding:8px 16px;border-radius:99px;background:var(--c-accent);color:#fff;font-weight:800;font-size:.9375rem;animation:wiggle 4s ease-in-out infinite}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-4deg)}94%{transform:rotate(4deg)}98%{transform:rotate(-2deg)}}
.face.back{transform:rotateY(180deg);background:linear-gradient(270deg,#efe8d6 0,#fffef9 9%,#fffef9 100%);border-radius:12px 2px 2px 12px;border:1px solid #e4dcc6;
  padding:18px 20px 14px;color:#14261d;display:flex;flex-direction:column;gap:6px}
.face.back h4{margin:0;font-size:1.25rem;line-height:1.1}
.face.back p{margin:0 0 4px;font-size:.875rem;line-height:1.35;color:#3b4a41}
.face.back .stepn{display:flex;gap:8px;align-items:center;font-size:.875rem;font-weight:700;line-height:1.15}
.face.back .stepn b{width:26px;height:26px;border-radius:50%;background:var(--c-forest);color:#fff;display:grid;place-items:center;font-size:.875rem;flex:none}
.paw{position:absolute;top:208px;width:46px;height:36px;z-index:5;transition:left 1s var(--ease);pointer-events:none}
.paw svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.paw.l{left:178px}.paw.r{left:376px}
.biobook.open .paw.l{left:-8px}
.bbclose{position:absolute;right:40px;top:58px;width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow-1);display:none;place-items:center;z-index:6}
.biobook.open .bbclose{display:grid}
.bbclose svg{width:22px;height:22px;stroke:var(--c-ink);stroke-width:2.6;fill:none;stroke-linecap:round}

canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

@media (max-width:900px){
  .hud-tl{width:min(300px,calc(100vw - 32px));left:16px;top:16px}
  .hud-tr{right:16px;top:auto;bottom:156px;flex-direction:column}
  .status{display:none}
  .info{right:12px;left:12px;width:auto;top:auto;bottom:12px;max-height:46vh}
  .info .photo{height:96px}
  .info h2{font-size:1.25rem}.info .lead{margin:6px 0 10px}
  .brand{padding:12px 14px}.brand h1{font-size:1.25rem}.progress{margin-top:10px}.dots{display:none}
  .hud-tl{width:min(250px,calc(100vw - 100px))}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

        break;

    await runSegment(S.cur, next);

    b.classList.toggle('visited', S.visited.has(i));
    b.classList.toggle('avail', i !== S.cur && S.layers[p.cat]);
    b.classList.toggle('off', !S.layers[p.cat]);
    $('.lbl', b).textContent = p[S.lang].name;
    b.setAttribute('aria-label', `${t('ariaPin')} ${p[S.lang].name}`);
  });
  const v = S.visited.size;
  $('#progTxt').textContent = `${v} / ${POINTS.length}`;
  $('#progBar').style.width = (v / POINTS.length * 100) + '%';
  [...$('#dots').children].forEach((d,i) => d.classList.toggle('on', S.visited.has(i)));
}
$('#dots').innerHTML = POINTS.map(() => '<span></span>').join('');

function buildLayers(){
  $('#layerlist').innerHTML = ['hist','eco','tur'].map(k =>
    `<label class="layer" style="--cat:${CAT[k].color}"><input type="checkbox" data-layer="${k}" ${S.layers[k]?'checked':''}><span class="sw"></span><span class="dotc"></span><span>${t(k)}</span></label>`).join('');
  $('#layerlist').querySelectorAll('input').forEach(i => i.addEventListener('change', () => {
    S.layers[i.dataset.layer] = i.checked; refreshNodes();
    $('#layerCnt').textContent = Object.values(S.layers).filter(Boolean).length + '/3';
  }));
}

/* ================= FICHA ================= */
function scene(kind, cat){
  const sky = `<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8cc4e6"/><stop offset="1" stop-color="#e9f1d9"/></linearGradient></defs><rect width="392" height="176" fill="url(#sk)"/><circle cx="318" cy="46" r="20" fill="#ffe9a8"/>`;
  const mtn = `<polygon points="0,120 70,58 130,104 200,46 290,112 340,78 392,116 392,176 0,176" fill="#5f8f7a"/><polygon points="0,140 90,92 170,132 250,88 330,130 392,104 392,176 0,176" fill="#3f7a56"/>`;
  const ground = `<rect y="140" width="392" height="36" fill="#2f6b43"/>`;
  let extra = '';
  if (kind==='visit') extra = `<rect x="130" y="92" width="130" height="58" fill="#f1e6cc"/><polygon points="120,94 195,58 270,94" fill="#8a4b2a"/><rect x="182" y="116" width="26" height="34" fill="#5b3a22"/><rect x="146" y="106" width="22" height="18" fill="#8cc4e6"/><rect x="222" y="106" width="22" height="18" fill="#8cc4e6"/><path d="M195 58v-22" stroke="#4a3a22" stroke-width="3"/><path d="M195 36h22l-5 6 5 6h-22z" fill="#d9631a"/>`;
  if (kind==='dam')   extra = `<polygon points="90,96 300,96 330,150 60,150" fill="#b7b0a2" stroke="#6d675c" stroke-width="3"/><rect y="150" width="392" height="26" fill="#3f95b2"/><rect x="150" y="118" width="22" height="30" fill="#7d776b"/><rect x="220" y="118" width="22" height="30" fill="#7d776b"/>`;
  if (kind==='view')  extra = `<rect y="108" width="392" height="68" fill="#4aa3bd"/><path d="M20 130q20-6 40 0M200 142q20-6 40 0M300 124q20-6 40 0" stroke="#fff" stroke-width="2.5" fill="none" opacity=".6"/><rect x="40" y="128" width="312" height="8" fill="#6d4a2a"/><path d="M60 128v32M130 128v32M200 128v32M270 128v32M340 128v32" stroke="#6d4a2a" stroke-width="6"/>`;
  if (kind==='forest'){ for(let i=0;i<9;i++){ const x=20+i*44+(i%2)*10, h=50+(i*17)%34; extra += `<polygon points="${x},${150-h} ${x-18},150 ${x+18},150" fill="${i%2?'#1d4a2a':'#2d6b3a'}"/><polygon points="${x},${150-h-18} ${x-14},${150-h+16} ${x+14},${150-h+16}" fill="${i%2?'#245a32':'#337a42'}"/><rect x="${x-3}" y="150" width="6" height="12" fill="#5b3a22"/>`; } }
  return `<svg viewBox="0 0 392 176" preserveAspectRatio="xMidYMid slice">${sky}${mtn}${kind==='view'||kind==='dam'?'':ground}${extra}</svg>`;
}
const info = $('#info');
function showInfo(i){
  const p = POINTS[i], L = p[S.lang];
  $('#infoPhoto').innerHTML = scene(p.photo, p.cat) + `<button class="close" id="infoClose" aria-label="${t('aria_close')}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
  $('#infoClose').addEventListener('click', hideInfo);
  const chip = $('#infoChip'); chip.style.setProperty('--cat', CAT[p.cat].color); chip.textContent = t(p.cat);
  $('#infoTitle').textContent = L.name;
  $('#infoMeta').textContent = `${t('point')} ${i+1} ${t('of')} ${POINTS.length}`;
  $('#infoLead').textContent = L.lead;
  $('#infoFacts').innerHTML = L.facts.map(([k,v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  const last = i === POINTS.length-1;
  $('#nextTxt').textContent = last ? t('back') : t('next');
  $('#btnNext').onclick = () => go(last ? 0 : i+1);
  info.classList.remove('go'); void info.offsetWidth; info.classList.add('go');
  document.body.classList.add('info-open');
}
function hideInfo(){ document.body.classList.remove('info-open'); }
$('#btn360').addEventListener('click', () => toast(t('toast360')));

/* ================= BIO-BOOK ================= */
const bio = $('#biobook');
function qrSVG(text){
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), quiet = 2, size = n + quiet*2;
  let d = ''; for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (q.isDark(r,c)) d += `M${c+quiet} ${r+quiet}h1v1h-1z`;
  return `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"><path d="${d}" fill="#14261d"/></svg>`;
}
function bookURL(){ const p = POINTS[S.cur]; return BASE_URL + (p.qr && S.visited.has(S.cur) && S.state!=='running' ? p.qr : ''); }
function openBook(){
  const p = POINTS[S.cur], hasQ = !!p.qr;
  const url = BASE_URL + (hasQ ? p.qr : '');
  $('#qr').innerHTML = qrSVG('http://' + url);
  $('#qr').setAttribute('aria-label', 'QR → ' + url);
  $('#qrUrl').textContent = url;
  $('#scanTitle').textContent = t('scanT');
  $('#scanText').textContent = hasQ ? t('scanTxtPoint') : t('scanTxtMap');
  bio.classList.add('open'); S.bookOpen = true; $('#bookHit').style.display='none';
  clearTimeout(openBook.tm); openBook.tm = setTimeout(() => closeBook(), 60000);
}
function closeBook(){ bio.classList.remove('open'); S.bookOpen = false; $('#bookHit').style.display='block'; clearTimeout(openBook.tm); }
$('#bookHit').addEventListener('click', () => { if (S.state==='running') return; openBook(); });
$('#bbClose').addEventListener('click', () => closeBook());
addEventListener('keydown', e => { if (e.key === 'Escape'){ closeBook(); hideInfo(); } });

/* ================= CONTROLES ================= */
function toast(msg){ const el = $('#tip'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.tm); toast.tm = setTimeout(hideTip, 3800); }
function hideTip(){ $('#tip').classList.remove('show'); }

function setLevel(l){
  S.level = l; document.body.className = document.body.className.replace(/lvl\d/,'') + ' lvl'+l;
  const opts = [...document.querySelectorAll('.seg .opt')];
  opts.forEach((o,i) => o.setAttribute('aria-checked', String(i===l)));
  const o = opts[l], pill = $('#segPill');
  pill.style.width = o.offsetWidth+'px'; pill.style.transform = `translateX(${o.offsetLeft-6}px)`;
}
document.querySelectorAll('.seg .opt').forEach(o => o.addEventListener('click', () => { S.zoomMul = 1; setLevel(+o.dataset.lvl); }));
$('#zin').addEventListener('click', () => { S.zoomMul = clamp(S.zoomMul*1.25, .5, 2.2); });
$('#zout').addEventListener('click', () => { S.zoomMul = clamp(S.zoomMul/1.25, .5, 2.2); });
function set3d(on){ S.mode3d = on; const b=$('#btn3d'); b.setAttribute('aria-pressed', String(on)); $('#t3d').textContent = on ? '3D' : '2D'; }
$('#btn3d').addEventListener('click', () => set3d(!S.mode3d));
$('#btnReset').addEventListener('click', () => { S.zoomMul = 1; set3d(true); setLevel(1); });
const sizes = ['16px','20px','24px'];
$('#btnText').addEventListener('click', () => { S.textStep = (S.textStep+1)%3; document.documentElement.style.setProperty('--fs', sizes[S.textStep]); requestAnimationFrame(() => setLevel(S.level)); });
$('#btnContrast').addEventListener('click', e => {
  const on = document.documentElement.dataset.contrast !== 'high';
  document.documentElement.dataset.contrast = on ? 'high' : 'normal'; e.currentTarget.setAttribute('aria-pressed', String(on));
});
$('#btnLang').addEventListener('click', () => { S.lang = S.lang==='es' ? 'en' : 'es'; applyLang(); });

function applyLang(){
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(e => e.setAttribute('aria-label', t(e.dataset.i18nAria)));
  document.querySelectorAll('.maplbl').forEach(e => e.textContent = t(e.dataset.k));
  $('#langTxt').textContent = t('lang'); $('#t3d').textContent = S.mode3d ? '3D' : '2D';
  $('#bookHit').setAttribute('aria-label', t('openBook')); $('#bbClose').setAttribute('aria-label', t('closeBook'));
  buildLayers(); refreshNodes();
  if (document.body.classList.contains('info-open')) showInfo(S.cur);
  if (S.bookOpen) openBook();
  requestAnimationFrame(() => setLevel(S.level));
}

/* ================= CONFETI ================= */
const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [], raf = 0;
function sizeCv(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; }
addEventListener('resize', () => { sizeCv(); setLevel(S.level); }); sizeCv();
function burstConfetti(){
  if (reduceMotion) return;
  const r = $('#stand').getBoundingClientRect(), ox = (r.left + r.width/2) * devicePixelRatio, oy = (r.top + r.height*.3) * devicePixelRatio;
  const cols = ['#ff9a3c','#ffd27a','#6cc58a','#7cc5d6','#fff'];
  for (let i=0;i<46;i++){ const a = -Math.PI/2 + (Math.random()-.5)*2.2, v = (5+Math.random()*7)*devicePixelRatio;
    parts.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:(5+Math.random()*5)*devicePixelRatio,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1}); }
  if (!raf) raf = requestAnimationFrame(stepConfetti);
}
function stepConfetti(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=.28*devicePixelRatio; p.vx*=.99; p.rot+=p.vr; p.life-=.014;
    cx.save(); cx.globalAlpha=Math.max(p.life,0); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.w/3,p.w,p.w*.6); cx.restore(); });
  parts = parts.filter(p => p.life>0);
  if (parts.length) raf = requestAnimationFrame(stepConfetti); else { raf = 0; cx.clearRect(0,0,cv.width,cv.height); }
}

/* ================= ARRANQUE ================= */
applyLang(); setLevel(1);
cam.zoom = LEVELS[1].zoom;
setTimeout(() => toast(t('tip').replace('{m}', MASCOT)), 900);
window.__demo = { go, openBook, closeBook, S, setLevel };   // útil para pruebas
})();
</script>
